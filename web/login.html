<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录</title>
    <!-- 首帧兜底：这段必须在外部样式表之前，浏览器拿到 HTML 就能把画布铺成深色，
         不会先白一下再变深（放到 link 之后就只能等样式表下载完才生效） -->
    <style>
        html{ background-color: #12212b; }
    </style>
    <link rel="stylesheet" href="./static/css/login.css?v=20261120a">
    <link rel="stylesheet" href="./static/css/semantic.min.css?v=20261118a">
    <link rel="stylesheet" href="./static/css/jquery-confirm.css?v=20261123a">
    <!-- 背景图提前下载：第一帧就是完整画面，不会先深色再"跳"出背景 -->
    <link rel="preload" as="image" href="./static/image/login-bg.webp">
    <!-- 登录成功后会跳到 index.html，而首页还要再下载约 1.4MB 脚本样式与背景图。
         用户在这里输入账号密码通常要几秒，正好用低优先级的 prefetch 先拉进缓存，
         跳转后 WebSocket 立刻就能建立，不会出现「进入大厅后要等两秒才在在线列表里看到自己」。
         注意：这里的 ?v= 必须和 index.html 里的版本号保持一致，否则会拉成两份。 -->
    <link rel="prefetch" as="script" href="./static/js/semantic.min.js?v=20261123a">
    <link rel="prefetch" as="script" href="./static/js/vue@2.js?v=20261123a">
    <link rel="prefetch" as="script" href="./static/js/common.js?v=20261116d">
    <link rel="prefetch" as="script" href="./static/js/index.js?v=20261126b">
    <link rel="prefetch" as="style" href="./static/css/index.css?v=20261118c">
    <link rel="prefetch" as="style" href="./static/css/bootstrap.min.css?v=20261123a">
    <link rel="prefetch" as="image" href="./static/image/bg-2.webp">
    <style>
        /* 注册面板默认隐藏：原来靠 login.js 事后 display:none，
           首帧会把「登录 + 注册」两张卡片同时画出来再收掉，看起来就是闪一下。
           这条必须写在 login.css 之后才能盖住其中的 display:block。 */
        #register{ display: none; }
    </style>
    <style>
        /* 输入框就地提示：红色边框 + 抖动，替代弹窗 */
        @keyframes fieldShake{
            0%, 100%{ transform: translateX(0); }
            20%{ transform: translateX(-5px); }
            40%{ transform: translateX(5px); }
            60%{ transform: translateX(-4px); }
            80%{ transform: translateX(4px); }
        }
        .ui.input.field-error > input{
            border-color: #e74c3c !important;
            box-shadow: 0 0 0 1px rgba(231,76,60,.55) inset !important;
            animation: fieldShake .4s ease;
        }
        .field-tip{
            display: none;
            margin: 6px 0 0 6px;
            font-size: 12px;
            line-height: 1.5;
            color: #e74c3c;
        }
        .panel-tip{
            display: none;
            margin: 6px 0 0 2px;
            font-size: 13px;
            line-height: 1.5;
            color: #2e8b40;
        }
        /* 登录页不引入 Bootstrap（避免压缩登录窗口高度）；仅对弹窗补齐列宽与默认按钮外观 */
        .jconfirm .jconfirm-box-container{
            width: min(420px, calc(100% - 28px));
            margin: 0 auto;
        }
        .jconfirm .jconfirm-box div.title-c .title{
            color: #333;
        }
        .jconfirm .jconfirm-box .buttons{
            padding: 0 15px 15px;
            text-align: right;
        }
        .jconfirm .jconfirm-box .buttons button{
            display: inline-block;
            margin: 0 0 0 8px;
            padding: 6px 12px;
            font-size: 14px;
            line-height: 1.42857143;
            color: #333;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .jconfirm .jconfirm-box .buttons button:hover{
            background: #e6e6e6;
            border-color: #adadad;
        }

        /* ===== 提交按钮的等待态 =====
           弱网或后端冷启动时，一次登录/注册可能要等十几秒。按钮直接禁用变灰容易被当成
           「点坏了」，所以保持主色、加转圈和文案，明确表示正在处理。
           选择器要压过 Semantic 的 .ui.button:disabled（那条是 opacity:.45、灰色）。 */
        .ui.button.fc-submit{
            position: relative;
        }
        .ui.button.fc-submit .fc-spin{
            display: none;
            width: 14px;
            height: 14px;
            margin-right: 7px;
            vertical-align: -2px;
            border: 2px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: fcSpin .7s linear infinite;
        }
        .ui.button.fc-submit.is-loading{
            opacity: 1 !important;
            cursor: progress;
            background-color: #1b6a9e !important;
            box-shadow: none !important;
        }
        .ui.button.fc-submit.is-loading .fc-spin{
            display: inline-block;
        }
        @keyframes fcSpin{
            to{ transform: rotate(360deg); }
        }

        /* 弱网提示：正常网速 5 秒内就返回了，根本看不到这一行 */
        .fc-wait-tip{
            display: none;
            margin: 8px 0 6px 2px;
            font-size: 12px;
            line-height: 1.6;
            color: #7d8892;
        }
        /* white-space: pre-line 让文案里的 \n 生效：长句按语义分两行，
           避免自动折行后第二行只剩「马上就好」这种孤行（text-wrap: pretty 对中文不生效，已弃用） */
        .fc-wait-tip .fc-wait-text{
            white-space: pre-line;
        }
        /* 10 秒那条文案末尾不再写「……」，省略号统一由 .fc-dots 承担，
           所以从 5 秒切到 10 秒时这三点原地继续呼吸，不闪断、不重播。
           （.is-cold 仍由 JS 打上，作为「已进入冷启动长等待」的状态标记，暂无专属样式） */
        .fc-wait-tip.show{
            display: block;
            animation: fcFadeIn .25s ease;
        }
        @keyframes fcFadeIn{
            from{ opacity: 0; transform: translateY(-3px); }
            to{ opacity: 1; transform: translateY(0); }
        }
        /* 省略号用三个点做呼吸动画，比 content 动画可靠（后者浏览器支持不一致） */
        .fc-dots{
            display: inline-block;
            margin-left: 1px;
        }
        .fc-dots b{
            display: inline-block;
            width: 3px;
            height: 3px;
            margin: 0 1px;
            border-radius: 50%;
            background: currentColor;
            opacity: .2;
            animation: fcDot 1.2s infinite;
        }
        .fc-dots b:nth-child(2){ animation-delay: .2s; }
        .fc-dots b:nth-child(3){ animation-delay: .4s; }
        @keyframes fcDot{
            0%, 60%, 100%{ opacity: .2; }
            30%{ opacity: 1; }
        }

    </style>
</head>
<body>
<!-- 背景独立固定层：任何分辨率/缩放都按 cover 铺满视口，不重复、不随内容高度裁切 -->
<div class="login-bg" aria-hidden="true"></div>
    <!--登录界面-->
    <div class="content" id="login">
        <h2 class="ui white header">在线联机五子棋</h2>
        <h3 class="ui black header">登录</h3><br>
        <div class="">
            <div class="fc-account-wrap">
                <div class="ui labeled input fc-account-input">
                    <div class="ui label">
                        账号
                    </div>
                    <input type="text" id="loginId" placeholder="在此输入账号" maxlength="12" autocomplete="username">
                    <button type="button" class="account-toggle" id="accountToggle" title="选择已登录的账号"
                            aria-label="选择已登录的账号" aria-expanded="false">
                        <i class="chevron down icon"></i>
                    </button>
                </div>
                <!-- 已登录过的账号列表：默认收起，点右侧箭头或点账号框展开 -->
                <div class="fc-user-menu" id="accountMenu" role="listbox" aria-label="已登录的账号"></div>
            </div>
            <div class="field-tip" id="tip-loginId"></div>
            <br><br>

            <div class="ui labeled input password-input">
                <div class="ui label">
                    密码
                </div>
                <input type="password" id="loginPassword" placeholder="在此输入密码" autocomplete="current-password">
                <button type="button" class="password-eye" title="显示密码"
                        onclick="togglePassword('loginPassword', this)">
                    <i class="eye icon"></i>
                </button>
            </div>
            <div class="field-tip" id="tip-loginPassword"></div>
            <div class="panel-tip" id="tip-loginPanel"></div>
            <!-- 等待提示：正常网速下不会出现，弱网/冷启动时才显示，替代"点了没反应" -->
            <div class="fc-wait-tip" id="wait-login" role="status" aria-live="polite">
                <span class="fc-wait-text">网络较慢，正在等待服务器响应</span><span class="fc-dots" aria-hidden="true"><b></b><b></b><b></b></span>
            </div>
            <div class="fc-remember-row">
                <label class="fc-remember" title="勾选后下次登录该账号会自动填好密码">
                    <input type="checkbox" id="rememberPassword">
                    <span class="fc-remember-mark"></span>
                    <span>记住密码</span>
                </label>
            </div>

            <button class="ui blue button fc-submit" id="loginBtn" onclick="login()">
                <span class="fc-spin" aria-hidden="true"></span><span class="fc-btn-text">登录</span>
            </button>
            <a class="ui green button" onclick="toRegister()">去注册</a>
        </div>
    </div>
    <!--注册界面-->
    <div class="content" id="register">
        <h2 class="ui white header">在线联机五子棋</h2>
        <h3 class="ui black header">注册</h3><br>
        <div class="">
            <div class="ui labeled input">
                <div class="ui label">
                    账号
                </div>
                <input type="text" id="registerId" placeholder="设置账号" maxlength="12" title="3–12 位">
            </div>
            <div class="field-tip" id="tip-registerId"></div>
            <br><br>
            <div class="ui labeled input">
                <div class="ui label">
                    昵称
                </div>
                <input type="text" id="registerName" placeholder="取个名字吧" maxlength="10" title="1–10 位">
            </div>
            <div class="field-tip" id="tip-registerName"></div>
            <br><br>
            <div class="ui labeled input password-input">
                <div class="ui label">
                    密码
                </div>
                <input type="password" id="registerPassword" placeholder="设置密码">
                <button type="button" class="password-eye" title="显示密码"
                        onclick="togglePassword('registerPassword', this)">
                    <i class="eye icon"></i>
                </button>
            </div>
            <div class="field-tip" id="tip-registerPassword"></div>
            <div class="panel-tip" id="tip-registerPanel"></div>
            <div class="fc-wait-tip" id="wait-register" role="status" aria-live="polite">
                <span class="fc-wait-text">网络较慢，正在等待服务器响应</span><span class="fc-dots" aria-hidden="true"><b></b><b></b><b></b></span>
            </div>
            <br><br>
            <button class="ui blue button fc-submit" id="registerBtn" onclick="register()">
                <span class="fc-spin" aria-hidden="true"></span><span class="fc-btn-text">提交</span>
            </button>
            <a class="ui green button" onclick="toLoginPage()">去登录</a>
        </div>
    </div>
<script src="./static/js/MyUtil.js?v=20261123a" type="text/javascript"></script>
<!-- 站点级公共脚本：位于网站根目录 /js/ 下，不随本项目部署路径变化 -->
<script src="/js/loper_too.js"></script>
<script src="./static/js/axios.min.js?v=20261123a" type="text/javascript"></script>
<script src="./static/js/jquery.min.js?v=20261123a"></script>
<script src="./static/js/jquery-confirm.js?v=20261123a"></script>
<script src="./static/js/login.js?v=20261126h" type="text/javascript"></script>
</body>
</html>
